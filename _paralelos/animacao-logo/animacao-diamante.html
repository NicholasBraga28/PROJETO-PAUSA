<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Animação da logo PAUSA com diamante</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1f; color: #ddd; font: 14px system-ui, sans-serif; }
  #palco { display: block; width: 100%; height: calc(100% - 44px); }
  #barra { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #555; background: #2a2a30; color: #eee; cursor: pointer; }
  input[type=range] { flex: 1; }
</style>
</head>
<body>
<!-- A mesma animação da versão 3 (animacao.html), com a logo de diamante: a palavra corta o
     diamante na cinta, e dele aparecem só o tampo (em cima) e o bico (embaixo). O diamante é
     desenhado inteiro, com duas linhas; a máscara "corte" apaga a faixa da palavra. -->
<svg id="palco" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#A06BC4" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#A06BC4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#A06BC4" stop-opacity="0"/>
    </radialGradient>
    <mask id="corte" maskUnits="userSpaceOnUse" x="-400" y="0" width="1600" height="1300">
      <rect x="-400" y="0" width="1600" height="1300" fill="#fff"/>
      <rect id="faixa" x="-400" y="0" width="1600" height="0" fill="#000"/>
    </mask>
  </defs>
  <rect width="1920" height="1080" fill="#F9F9F1"/>
  <ellipse id="brilho" cx="960" cy="540" rx="0" ry="0" fill="url(#halo)"/>
  <g id="logo" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="diamante" mask="url(#corte)" stroke="#7D3AA4" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter"></g>
    <g id="palavra">
    <path id="P"  stroke-width="28" d="M86 566 V361 H118 A48 55.5 0 0 1 118 472 H86"/>
    <path id="A1" stroke-width="28" d="M178 566 L228 361 L285 566 M196 492 H264"/>
    <path id="barra1" stroke="#7D3AA4" stroke-width="34" d=""/>
    <path id="barra2" stroke="#7D3AA4" stroke-width="34" d=""/>
    <g id="sorrisoG"><path id="sorriso" stroke="#7D3AA4" stroke-width="18" d="M326 606 A57 57 0 0 0 435 606"/></g>
    <path id="S"  stroke-width="28" d="M550 382 C542 368 530 362 514 362 C494 362 478 380 478 404 C478 432 496 450 515 462 C536 474 554 492 554 522 C554 550 536 566 514 566 C496 566 482 558 476 546"/>
    <path id="A2" stroke-width="28" d="M592 566 L641.5 361 L698.5 566 M610 492 H678"/>
    </g>
  </g>
</svg>
<div id="barra">
  <button id="tocar">pausar</button>
  <input id="tempo" type="range" min="0" max="5" step="0.001" value="0">
  <span id="rotulo">0,00 s</span>
  <button id="exportar">exportar MP4</button>
  <span id="estado"></span>
</div>
<script>
const DURACAO = 5.0, FPS = 30
const CINZA = '#494948', ROXO = '#7D3AA4'
const NS = 'http://www.w3.org/2000/svg'

// Diamante nas coordenadas da logo: meia largura do tampo (mesa) e da cinta, altura do tampo,
// da cinta e do bico, e o espaço entre as duas linhas. A variante vem do endereço:
// animacao-diamante.html?variante=menor ou ?variante=palavra.
const VARIANTES = {
  // proporções da imagem de referência; a palavra esconde a cinta
  original: { mesa: 295, mesaY: 178, cinta: 533, cintaY: 440, bicoY: 1100, espaco: 40, palavra: 1 },
  // diamante mais estreito que a palavra (escolhido pelo dono): as pontas do tampo caem nos vãos
  // P|A e S|A, e a faixa desce até abaixo do sorriso para o bico reaparecer só depois dele
  menor:    { mesa: 113, mesaY: 227, cinta: 205, cintaY: 327, bicoY: 900, espaco: 22, palavra: 1, faixa: [312, 668] },
  // diamante original e palavra 35% maior
  palavra:  { mesa: 295, mesaY: 178, cinta: 533, cintaY: 440, bicoY: 1100, espaco: 40, palavra: 1.35 },
}
const NOME = new URLSearchParams(location.search).get('variante') || 'original'
const V = VARIANTES[NOME] || VARIANTES.original
const SAIDA = NOME === 'original' ? 'pausa-logo-diamante.mp4' : `pausa-logo-diamante-${NOME}.mp4`
const CX = 392, PALAVRA_CY = 463
const DIAMANTE = [[CX - V.mesa, V.mesaY], [CX + V.mesa, V.mesaY], [CX + V.cinta, V.cintaY], [CX, V.bicoY], [CX - V.cinta, V.cintaY]]
// Onde a palavra corta o diamante: do topo das letras - 35 à base + 35, crescendo com a palavra.
const FAIXA = V.faixa ?? [PALAVRA_CY - (PALAVRA_CY - 312) * V.palavra, PALAVRA_CY + (615 - PALAVRA_CY) * V.palavra]
const ESCALA = 0.95, CENTRO = [CX, (V.mesaY + V.bicoY) / 2]   // centro do conjunto: do tampo ao bico

const $ = id => document.getElementById(id)
const limite = x => Math.min(1, Math.max(0, x))
const fase = (t, ini, dur) => limite((t - ini) / dur)
const suave = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
const saida = p => 1 - Math.pow(1 - p, 3)
const saidaVolta = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2) }
const mistura = (a, b, p) => {
  const n = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))
  const [x, y] = [n(a), n(b)]
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * p).toString(16).padStart(2, '0')).join('')
}

// Linha de dentro: cada lado recuado ESPACO para dentro, e os cantos onde os lados se cruzam.
function cruzar([p1, p2], [p3, p4]) {
  const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0])
  const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / d
  return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])]
}
function recuar(pts, d) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length
  const lados = pts.map((a, i) => {
    const b = pts[(i + 1) % pts.length]
    let nx = a[1] - b[1], ny = b[0] - a[0]; const L = Math.hypot(nx, ny); nx /= L; ny /= L
    if ((cx - (a[0] + b[0]) / 2) * nx + (cy - (a[1] + b[1]) / 2) * ny < 0) { nx = -nx; ny = -ny }
    return [[a[0] + nx * d, a[1] + ny * d], [b[0] + nx * d, b[1] + ny * d]]
  })
  return lados.map((l, i) => cruzar(lados[(i - 1 + lados.length) % lados.length], l))
}
// Cada diamante em duas metades que saem do meio do tampo e se encontram no bico.
const metades = pts => {
  const [tl, tr, gr, bico, gl] = pts, topo = [(tl[0] + tr[0]) / 2, tl[1]]
  const d = arr => 'M' + arr.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')
  return [d([topo, tr, gr, bico]), d([topo, tl, gl, bico])]
}
const linhasDiamante = [...metades(DIAMANTE), ...metades(recuar(DIAMANTE, V.espaco))].map(d => {
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); $('diamante').appendChild(p); return p
})
$('faixa').setAttribute('y', FAIXA[0]); $('faixa').setAttribute('height', FAIXA[1] - FAIXA[0])

const LETRAS = [['P', 0.30], ['A1', 0.55], ['S', 1.60], ['A2', 1.85]]
const comprimento = {}
for (const [id] of LETRAS) comprimento[id] = $(id).getTotalLength()

function tracar(el, p) {
  const L = el.getTotalLength()
  el.setAttribute('stroke-dasharray', `${L} ${L}`)
  el.setAttribute('stroke-dashoffset', L * (1 - p))
  el.setAttribute('opacity', p > 0 ? 1 : 0)
}

function desenhar(t) {
  for (const [id, ini] of LETRAS) {
    const p = suave(fase(t, ini, 0.55)), cor = fase(t, ini + 0.45, 0.4), L = comprimento[id], el = $(id)
    el.setAttribute('stroke-dasharray', `${L} ${L}`)
    el.setAttribute('stroke-dashoffset', L * (1 - p))
    el.setAttribute('stroke', mistura(ROXO, CINZA, cor))
    el.setAttribute('opacity', p > 0 ? 1 : 0)
  }
  // O "U": as duas barras sobem do chão, como um botão de pausa.
  for (const [id, x, ini] of [['barra1', 344.5, 0.95], ['barra2', 416.5, 1.05]]) {
    const p = fase(t, ini, 0.5), h = (553 - 365) * saidaVolta(p)
    $(id).setAttribute('d', p > 0 ? `M${x} 553 V${553 - h}` : '')
  }
  tracar($('sorriso'), saida(fase(t, 1.35, 0.5)))
  // O diamante se desenha quando a palavra termina: a linha de fora e, logo atrás, a de dentro,
  // as duas metades saindo do meio do tampo e se encontrando no bico.
  linhasDiamante.forEach((el, i) => tracar(el, suave(fase(t, i < 2 ? 2.15 : 2.35, 1.0))))
  // No fim só o sorriso dá o zoom: cresce em torno do próprio centro e volta.
  const zoom = fase(t, 3.45, 0.8), k = 1 + 0.2 * Math.sin(Math.PI * suave(zoom))
  $('sorrisoG').setAttribute('transform', `translate(380.5 626) scale(${k}) translate(-380.5 -626)`)
  // Brilho roxo suave atrás da palavra.
  const pb = saida(fase(t, 3.2, 0.9))
  $('brilho').setAttribute('cx', 960)
  $('brilho').setAttribute('cy', 540 + (470 - CENTRO[1]) * ESCALA)
  $('brilho').setAttribute('rx', 520 * V.palavra * pb)
  $('brilho').setAttribute('ry', 260 * V.palavra * pb)
  $('brilho').setAttribute('opacity', 0.35 + 0.65 * pb)
  $('palavra').setAttribute('transform', `translate(${CX} ${PALAVRA_CY}) scale(${V.palavra}) translate(${-CX} ${-PALAVRA_CY})`)
  $('logo').setAttribute('transform', `translate(960 540) scale(${ESCALA}) translate(${-CENTRO[0]} ${-CENTRO[1]})`)
}

let tocando = true, t0 = performance.now()
function laco(agora) {
  if (tocando) {
    const tt = Math.min(((agora - t0) / 1000) % (DURACAO + 1), DURACAO)
    desenhar(tt); $('tempo').value = tt; $('rotulo').textContent = tt.toFixed(2).replace('.', ',') + ' s'
  }
  requestAnimationFrame(laco)
}
requestAnimationFrame(laco)
$('tocar').onclick = () => { tocando = !tocando; $('tocar').textContent = tocando ? 'pausar' : 'tocar'; t0 = performance.now() - $('tempo').value * 1000 }
$('tempo').oninput = e => { tocando = false; $('tocar').textContent = 'tocar'; desenhar(+e.target.value); $('rotulo').textContent = (+e.target.value).toFixed(2).replace('.', ',') + ' s' }

async function quadroPng(t) {
  desenhar(t)
  const svg = new XMLSerializer().serializeToString($('palco')).replace('<svg ', '<svg width="1920" height="1080" ')
  const img = new Image()
  img.src = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }))
  await img.decode()
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080
  c.getContext('2d').drawImage(img, 0, 0, 1920, 1080)
  URL.revokeObjectURL(img.src)
  return new Promise(r => c.toBlob(r, 'image/png'))
}
window.exportar = async () => {
  tocando = false
  const total = Math.round(DURACAO * FPS) + 1
  for (let i = 0; i < total; i++) {
    const png = await quadroPng(i / FPS)
    const r = await fetch(`/quadro/${String(i).padStart(4, '0')}`, { method: 'POST', body: png })
    if (!r.ok) throw new Error('servidor recusou o quadro ' + i)
    $('estado').textContent = `quadro ${i + 1} de ${total}`
  }
  const fim = await fetch(`/fim?fps=${FPS}&nome=${SAIDA}`, { method: 'POST' }).then(r => r.json())
  $('estado').textContent = fim.ok ? `pronto: ${fim.arquivo}` : 'falhou: ' + fim.erro
  return fim
}
$('exportar').onclick = () => window.exportar().catch(e => { $('estado').textContent = 'falhou: ' + e.message })
</script>
</body>
</html>
