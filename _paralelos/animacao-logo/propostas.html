<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Propostas da logo PAUSA com o diamante</title>
<style>
  body { margin: 0; background: #1b1b1f; color: #ddd; font: 14px system-ui, sans-serif; }
  svg { display: block; width: 100%; height: auto; margin-bottom: 8px; }
</style>
</head>
<body>
<!-- Três propostas paradas da logo com o diamante da Semantix como apoio, para o dono escolher
     antes de animar. O diamante é o do ícone da Semantix (medido nos pixels: contorno e facetas). -->
<div id="propostas"></div>
<script>
const CINZA = '#494948', ROXO = '#7D3AA4', FUNDO = '#F9F9F1'
const PALAVRA = `
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="${CINZA}" stroke-width="28" d="M86 566 V361 H118 A48 55.5 0 0 1 118 472 H86"/>
    <path stroke="${CINZA}" stroke-width="28" d="M178 566 L228 361 L285 566 M196 492 H264"/>
    <path stroke="${ROXO}" stroke-width="34" d="M344.5 553 V365"/>
    <path stroke="${ROXO}" stroke-width="34" d="M416.5 553 V365"/>
    <path stroke="${ROXO}" stroke-width="18" d="M326 606 A57 57 0 0 0 435 606"/>
    <path stroke="${CINZA}" stroke-width="28" d="M550 382 C542 368 530 362 514 362 C494 362 478 380 478 404 C478 432 496 450 515 462 C536 474 554 492 554 522 C554 550 536 566 514 566 C496 566 482 558 476 546"/>
    <path stroke="${CINZA}" stroke-width="28" d="M592 566 L641.5 361 L698.5 566 M610 492 H678"/>
  </g>`

// Ícone da Semantix (200x200): contorno em sentido horário e facetas, em coordenadas dele.
const ICONE = {
  contorno: [[73.5, 54], [126.5, 54], [149, 78], [100, 143], [51, 78]],
  facetas: [
    [[73.5, 54], [81.5, 73]], [[100, 54], [81.5, 73]], [[100, 54], [115, 82]], [[126.5, 54], [115, 82]],
    [[81.5, 73], [62.6, 93.4]], [[81.5, 73], [96, 134]], [[115, 82], [103, 134]], [[115, 82], [126.2, 108]],
    [[149, 78], [66, 98]], [[66, 98], [126.2, 108]],
  ],
}
// Leva o ícone para a logo: meia cinta G, cinta na altura yc, tampo e bico com alturas próprias.
const diamante = ({ cx, G, yc, tampo, bico }) => ([x, y]) =>
  [cx + (x - 100) * G / 49, y < 78 ? yc - (78 - y) * tampo / 24 : yc + (y - 78) * bico / 65]

const caminho = pts => 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]
// Partes de um segmento fora da faixa horizontal [y0, y1], onde a palavra passa.
function cortar([a, b], y0, y1) {
  if (a[1] === b[1]) return a[1] < y0 || a[1] > y1 ? [[a, b]] : []
  const t0 = (y0 - a[1]) / (b[1] - a[1]), t1 = (y1 - a[1]) / (b[1] - a[1])
  const lo = Math.min(t0, t1), hi = Math.max(t0, t1), partes = []
  const parte = (ta, tb) => { if (tb - ta > 1e-3) partes.push([lerp(a, b, ta), lerp(a, b, tb)]) }
  parte(0, Math.min(1, Math.max(0, lo))); parte(Math.max(0, Math.min(1, hi)), 1)
  return partes
}
const lados = pts => pts.map((p, i) => [p, pts[(i + 1) % pts.length]])
const quadro = (conteudo, cx, cy, escala) => `
  <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <rect width="1920" height="1080" fill="${FUNDO}"/>
    <g transform="translate(960 540) scale(${escala}) translate(${-cx} ${-cy})">${conteudo}</g>
  </svg>`

const PROPOSTAS = {
  // A: a pedra por trás da palavra, preenchida em lilás claro com as facetas em branco.
  'proposta-a': () => {
    const m = diamante({ cx: 392, G: 400, yc: 463, tampo: 196, bico: 400 })
    const contorno = ICONE.contorno.map(m)
    const facetas = ICONE.facetas.map(([a, b]) => `<path d="${caminho([m(a), m(b)])}"/>`).join('')
    return quadro(`
      <path d="${caminho(contorno)} Z" fill="#E6D8F0"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">${facetas}</g>
      ${PALAVRA}`, 392, (contorno[0][1] + contorno[3][1]) / 2, 1.0)
  },
  // B: contorno roxo com as facetas, cortado pela palavra com folga igual e pontas redondas.
  'proposta-b': () => {
    const m = diamante({ cx: 392, G: 340, yc: 347, tampo: 167, bico: 452 })
    const contorno = ICONE.contorno.map(m)
    const segmentos = [...lados(contorno), ...ICONE.facetas.map(([a, b]) => [m(a), m(b)])]
    const linhas = segmentos.flatMap(s => cortar(s, 317, 682)).map(s => `<path d="${caminho(s)}"/>`).join('')
    return quadro(`
      <g fill="none" stroke="${ROXO}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">${linhas}</g>
      ${PALAVRA}`, 392, (contorno[0][1] + contorno[3][1]) / 2, 0.95)
  },
  // C: o diamante da Semantix pequeno e sólido, como uma joia acima das barras de pausa.
  'proposta-c': () => {
    const m = diamante({ cx: 380.5, G: 62, yc: 218, tampo: 30, bico: 82 })
    const contorno = ICONE.contorno.map(m)
    const facetas = ICONE.facetas.map(([a, b]) => `<path d="${caminho([m(a), m(b)])}"/>`).join('')
    return quadro(`
      <path d="${caminho(contorno)} Z" fill="${ROXO}" stroke="${ROXO}" stroke-width="6" stroke-linejoin="round"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${facetas}</g>
      ${PALAVRA}`, 392, (contorno[0][1] + 655) / 2, 1.1)
  },
}

const alvo = document.getElementById('propostas')
for (const [nome, fazer] of Object.entries(PROPOSTAS)) alvo.insertAdjacentHTML('beforeend', fazer())

async function png(svg) {
  const img = new Image()
  img.src = URL.createObjectURL(new Blob([svg.replace('<svg ', '<svg width="1920" height="1080" ')], { type: 'image/svg+xml' }))
  await img.decode()
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080
  c.getContext('2d').drawImage(img, 0, 0)
  return new Promise(r => c.toBlob(r, 'image/png'))
}
window.salvar = async () => {
  const feitos = []
  for (const [nome, fazer] of Object.entries(PROPOSTAS)) {
    const r = await fetch(`/imagem/${nome}.png`, { method: 'POST', body: await png(fazer()) }).then(x => x.json())
    feitos.push(r.arquivo || r.erro)
  }
  return feitos
}
</script>
</body>
</html>
